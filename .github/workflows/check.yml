name: Continuous Integration & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Sync Plain English datasets
        run: node scripts/sync-wcag-plain-english.mjs
      - name: Run Astro diagnostics
        run: npm run check
      - name: Build production bundle
        run: npm run build
